name: Nomi V2 foundation checks
on:
  push:
    branches: [nomi-v2-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run doctor
  preview:
    needs: verify
    if: github.ref == 'refs/heads/nomi-v2-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Nomi-V2-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nomi-V2-Preview
          path: v2/Nomi-V2-Preview.apk
          if-no-files-found: error
      - name: Publish explicitly experimental build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v2-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" Nomi-V2-Preview.apk --target "$GITHUB_SHA" --prerelease --title "Nomi V2 experimental preview" --notes "Local-only preview. Not production; Google/Supabase not configured. Adhan, persistent alarm and migration not complete. No device QA. Separate package."
