name: Nomi V2 foundation checks
on:
  push:
    branches: [nomi-v2-foundation]
    paths-ignore:
      - 'v2/tests/android_smoke.py'
      - 'v2/docs/qa.md'
      - '.github/workflows/nomi-v2-retry-smoke.yml'
      - '.github/workflows/nomi-v2-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nomi-v2-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run doctor
  preview:
    needs: verify
    if: github.ref == 'refs/heads/nomi-v2-foundation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [green, purple]
    env:
      EXPO_PUBLIC_NOMI_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_SUPABASE_URL: https://hybocuzpbvqnlplsehtf.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SNZUlXicdpOUjgJYoAUu-Q_ITUYSZxa
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Nomi-${{ matrix.variant }}-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nomi-${{ matrix.variant }}-Preview
          path: v2/Nomi-${{ matrix.variant }}-Preview.apk
          if-no-files-found: error
  smoke:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [green, purple]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nomi-${{ matrix.variant }}-Preview
          path: apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 v2/tests/android_smoke.py ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nomi-${{ matrix.variant }}-screenshots
          path: qa-screenshots/
          if-no-files-found: warn
  release:
    needs: [preview, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        variant: [green, purple]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nomi-${{ matrix.variant }}-Preview
          path: apk
      - name: Publish explicitly experimental build after smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v2-preview-${{ matrix.variant }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "apk/Nomi-${{ matrix.variant }}-Preview.apk" --target "$GITHUB_SHA" --prerelease --title "Nomi ${{ matrix.variant }} experimental preview" --notes "Local preview with Android smoke checks; not a production release. No cloud sync; full adhan, persistent alarm, visual reference review remain."
