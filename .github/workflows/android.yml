name: Build Nomi Smart APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NomiSmart-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NomiSmart.apk
          gh release create "android-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" NomiSmart.apk --target "$GITHUB_SHA" --title "Nomi Smart Android" --notes "Android 8+ development build"
