name: Nomi retry Android UI checks
on:
  push:
    branches: [nomi-v2-foundation]
    paths: ['.github/workflows/nomi-v2-retry-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [green, purple]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Nomi-${{ matrix.variant }}-Preview
          run-id: 46044861191
          github-token: ${{ github.token }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 v2/tests/android_smoke.py ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nomi-${{ matrix.variant }}-screenshots
          path: qa-screenshots/
  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      matrix:
        variant: [green, purple]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Nomi-${{ matrix.variant }}-Preview
          run-id: 46044861191
          github-token: ${{ github.token }}
          path: apk
      - name: Publish only after successful UI smoke checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v2-preview-${{ matrix.variant }}-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "apk/Nomi-${{ matrix.variant }}-Preview.apk" --target fa7c45320485d2e25f2f5d5cccdd47b42c5ef8b7 --prerelease --title "Nomi ${{ matrix.variant }} experimental preview" --notes "Existing APK verified by emulator retry; not production. No cloud sync, full adhan or persistent alarm; reference screenshots require visual review."
